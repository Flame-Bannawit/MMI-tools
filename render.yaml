services:
  - type: web
    name: moneymanagement-mm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./mmi.db
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: LINE_CHANNEL_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
